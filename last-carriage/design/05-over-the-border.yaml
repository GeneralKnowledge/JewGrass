# LAST CARRIAGE Song Design: Over the Border (track 05, round 1).
slug: lastcarriage-over-the-border
title: Over the Border
order: 5
family: glide
version: 2   # v2 Nov 15: heavier and darker (Reuben); the hum is replaced by noir piano and saxophone
role: The lift. Crossing into Scotland in the dark; the most melodic, highest-energy track. From the seed mix's 7:04-10:54 stretch (F# minor, its clearest key, bright pitch-gliding lead).
test: Does the gliding lead carry a whole track as a hook, with no voice doing the work?

render:
  bpm: 118
  key: F# minor
  timesig: "4"
  seconds: 200        # 96 bars at 118 is 195 s

palette:
  lead: dark distorted gliding synth lead, the glide motif (bend up a fourth, fall back), wider each time
  guitars: palm-muted down-tuned guitar chugs on eighth notes, the rails, never stop until the breakdown
  bed: dark synth chords
  bass: distorted synth bass doubling the chugs
  drums: pounding drums, kick locked to the guitars
  breakdown: slow lonely noir piano and a mournful saxophone playing the glide shape
  left_out: voice, half-time drums, anything bright

harmony: F#m - D - A - E, one bar each; the breakdown sits on D - E for eight bars.
drums: Kick on 1 and 3 with a ghost on the "and" of 4, snare on 2 and 4, hats in sixteenths with triplet rolls into every eighth bar.
bass_movement: Driving eighths on the root, octave jump on beat 4; in the breakdown it stops dead and the sub holds.
the_moment: The breakdown. Guitars and drums stop, a lonely piano and a mournful saxophone play the glide shape once, then the full groove crashes back in with the lead an octave higher.

sections:
  - name: groove A
    tag: instrumental, straight in, palm-muted guitar chugs, pounding drums, distorted gliding synth lead hook
    bars: 16
    performer: none
  - name: groove B
    tag: instrumental, lead glides wider, distorted synth bass, dark synth chords
    bars: 16
    performer: none
  - name: peak 1
    tag: instrumental, full force, power chords, lead doubled an octave up
    bars: 16
    performer: none
  - name: breakdown
    tag: instrumental breakdown, guitars and drums stop, lonely noir piano and mournful saxophone
    bars: 8
    performer: none
  - name: rebuild
    tag: instrumental, guitar chugs return alone, drums build back in
    bars: 8
    performer: none
  - name: peak 2
    tag: instrumental, full groove crashes back heavier, lead an octave higher, biggest moment
    bars: 24
    performer: none
  - name: run out
    tag: instrumental, drums drop away, guitar chugs and the lead glide keep going
    bars: 8
    performer: none

ending: Guitar chugs and one last wide glide carry straight into Points Failure (segue).
caption: >-
  118 bpm, F# minor, dark and driving, a distorted gliding synth lead that bends up and falls back as the hook,
  palm-muted down-tuned guitar chugs on eighth notes underneath, pounding drums, a breakdown with only a lonely
  noir piano and a mournful saxophone, then the groove crashes back heavier
