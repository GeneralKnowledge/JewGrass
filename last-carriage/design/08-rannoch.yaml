# LAST CARRIAGE Song Design: Rannoch (track 08, round 1).
slug: lastcarriage-rannoch
title: Rannoch
order: 8
family: pulse
version: 2   # v2 Nov 15: heavier and darker (Reuben); a grim first light, not a pretty one
role: First light on the open moor. Grim and hypnotic, the last stretch before home. From the seed mix's 16:00-17:50 stretch (fast rising and falling arpeggio, around 103 bpm).
test: Can a short arpeggio track stay as heavy and dark as the rest?

render:
  bpm: 104
  key: E minor
  timesig: "4"
  seconds: 150        # 64 bars at 104 is 148 s

palette:
  lead: fast menacing synth arpeggio built from the departure figure, stretched over two octaves
  guitars: down-tuned distorted guitar swells under the arpeggio, chugs in the full section
  bed: deep dark synth pads that grow slowly
  bass: distorted synth bass on the root, long notes, no glides
  drums: heavy steady kick, gated snare on 4 in the second half
  left_out: voice, any lead other than the arpeggio, anything bright

harmony: Em - Cmaj7 - G - D, two bars each; the last eight bars move to Dm to set up End of the Line.
drums: Four-on-the-floor soft kick, closed hats on the offbeat; second half adds a clap on 4 and open hats on the "and" of 4.
bass_movement: Long sub notes on each root; in the last eight bars it steps down E to D.
the_moment: The last eight bars, where the chords turn from E minor to D minor and the arpeggio slows to half speed, arriving home.

sections:
  - name: arpeggio
    tag: instrumental, straight in, fast menacing synth arpeggio, heavy kick, distorted bass
    bars: 16
    performer: none
  - name: opening up
    tag: instrumental, dark synth pads and distorted guitar swells rise underneath
    bars: 16
    performer: none
  - name: full
    tag: instrumental, guitar chugs, gated snare on four, arpeggio over two octaves, heaviest point
    bars: 16
    performer: none
  - name: thinning
    tag: instrumental, drums drop to the kick, pads hold
    bars: 8
    performer: none
  - name: turn home
    tag: instrumental, chords turn to D minor, arpeggio slows to half speed
    bars: 8
    performer: none

ending: The slowed arpeggio on D minor, which End of the Line picks up (segue).
caption: >-
  104 bpm, E minor, hypnotic and grim, a fast menacing synth arpeggio over two octaves, heavy steady kick,
  distorted synth bass, down-tuned distorted guitar swells, deep dark synth pads that grow slowly, the last bars
  turn to D minor and the arpeggio slows down
