lyrics: |
  [verse - starts immediately, furious Scottish male rap, heavy guitars]
  Two guards asleep and two cameras broke
  On the one night ye'd want them, is this a joke?
  Taken off the watch and left on his own
  The man wi' the names, wi' nae cellmate, alone
  Nobody saw it and nobody heard
  The statement was out before anybody stirred
  The logs were filled in, but they weren't filled in right
  And the tape from the corridor skips a minute that night

  [chorus - screamed gang chant, heavy guitars]
  Who turned the cameras off? (Who?)
  Who signed the guard roster? (Who?)
  Who had the most to lose? (Who?)
  Ye don't need a theory when ye've got the clues
  We're only asking questions!

  [verse - furious Scottish male rap, faster]
  The client list exists, then it doesn't, then it's sealed
  Then it's lost in the system, then it's not for reveal
  One doctor says this and another says that
  And the ones wi' the answers are wearing a hat
  At a dinner in a city wi' a glass in their hand
  And a lawyer on retainer and a holiday planned

  [chorus - screamed gang chant, heavy guitars]
  Who turned the cameras off? (Who?)
  Who signed the guard roster? (Who?)
  Who had the most to lose? (Who?)
  Ye don't need a theory when ye've got the clues
  We're only asking questions!

  [bridge - half time, guitars drop out, haunting sung female vocal]
  Maybe it's chaos, maybe it's a plan
  Maybe it's easier to blame one dead man
  Maybe the truth is the dullest of all
  Nobody did it, and everyone let it fall

  [final chorus - everyone, screamed, full band]
  Who turned the cameras off? (Who?)
  Who signed the guard roster? (Who?)
  Who had the most to lose? (Who?)
  Ye don't need a theory when ye've got the clues
  Who turned the cameras off?
