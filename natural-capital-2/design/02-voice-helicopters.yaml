slug: bon-voice-helicopters
title: 'Voice Note: Helicopters'
order: 2
status: voice
credit: Ewan (Reuben's speaking voice)
purpose: Bring the story home to the glen. The financier had a shooting lodge across the loch, and the village looked away.
render: {seconds: 40}
script: |
  Morag, it's me. That name you asked about. Varne.
  Aye. He had the lodge. Across the loch. Corran Lodge.
  Every August, helicopters. Three, four a week.
  Dad used to say, don't look, it's just the gentry.
  Old Hughie was a ghillie up there. Never said one word about it. Ever.
  Got a new car every year, mind.
  Why are you asking? Morag?
  Phone me back.
