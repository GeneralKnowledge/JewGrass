slug: bon-the-black-book
title: The Black Book
order: 3
status: generate
credit: Frontman (rap), Ghost (chorus)
purpose: The leak arrives. Morag opens the files and the band lists who's in them, by job not by name. The point is how many kinds of power are in one book.
render: {bpm: 90, key: A minor, timesig: "4", seconds: 220}
caption: >-
  dark political hip hop with Celtic country trap, starts straight in with an angry precise Scottish male rap
  over hard boom bap drums, switching to heavy trap drums on the second verse, distorted 808 bass, banjo loop
  sitting back, haunting sung female chorus, low choir pad under the chorus, glitch stutters between sections,
  warm cohesive blended mix, 90 bpm, A minor, ends on the sung chorus
lyrics: |
  [verse - starts immediately, angry precise Scottish male rap, boom bap drums]
  Morag got a parcel wi' nae name on the front
  Six hundred pages and the language was blunt
  Flight logs, dinners, a calendar of guests
  The richest men alive and his every request
  A senator, a scientist, a lord wi' a seat
  A banker and a preacher and a star off the screen
  A modelling agent and a tech boy's money
  And a lawyer at the table who thought it was funny
  Not one of them ever saw the inside of a cell
  And every one of them is doing very well

  [chorus - haunting sung female vocal, choir pad, 808]
  It's all in the black book, the black book
  Every door in the world that he opened wi' a look
  It's all in the black book, nobody's named
  Everybody's in it and nobody's ashamed

  [verse - angry Scottish male rap, heavy trap drums]
  He'd a lodge up the glen where my brother could see
  Helicopters landing every August, two or three
  Ghillies got paid and the ghillies forgot
  The village got a new roof on the hall, like as not
  He gave tae the church and he gave tae the school
  He gave tae the party and he played by his rules
  And the minister thanked him in the Sunday prayers
  While the cars came up at night and nobody went upstairs

  [chorus - haunting sung female vocal, choir pad, 808]
  It's all in the black book, the black book
  Every door in the world that he opened wi' a look
  It's all in the black book, nobody's named
  Everybody's in it and nobody's ashamed

  [verse - Scottish male rap, faster, glitches creeping in]
  Ye can say it was one bad man and a book
  But a book's just a mirror, so go on, take a look
  It took a pilot tae fly it and a bank tae move the cash
  A lawyer tae bury it and a paper tae get it trashed
  Every one of them a page, every page a name
  Every name a reason that the system stayed the same

  [final chorus - everyone, layered female vocals, big drums]
  It's all in the black book, the black book
  Every door in the world that he opened wi' a look
  It's all in the black book, nobody's named
  Everybody's in it and nobody's ashamed
