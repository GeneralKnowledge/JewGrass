slug: bon-rose
title: Rose
order: 7
status: generate
credit: Rose, a survivor (fictional, sung by Ghost)
purpose: The heart of the album and the only voice that isn't guilty. Nothing explicit. Not being believed, being called "the girls", and taking her name back.
render: {bpm: 68, key: B minor, timesig: "4", seconds: 260}
caption: >-
  slow haunting emotional ballad, starts straight in with a fragile female vocal over soft piano, distant string
  section, deep slow 808 swells, layered female harmonies on the chorus, quiet voice and piano bridge, huge final
  chorus with full strings and heavy drums, warm cohesive blended mix, 68 bpm, B minor, ends on the voice alone
lyrics: |
  [verse - starts immediately, fragile female vocal, soft piano]
  I was the girl who brought the towels
  I was the girl in the borrowed shoes
  They said a rich man needed helpers
  Two hundred dollars, nothing to lose
  I told a policeman the first time I could
  He wrote it all down, then he closed the book
  I told a lawyer, and she believed me
  Then a man in a suit made a deal while I looked

  [chorus - layered female harmonies, strings, soft 808]
  Say my name, not his
  He's had his name in lights
  Say my name, I'm still here
  And I'm not afraid tonight

  [verse - female vocal, strings swell underneath]
  They printed his face on every paper
  His island, his jet, his famous friends
  They printed the names of the men at the table
  And they called us "the girls", and that's where it ends
  I'm older now and I've got a daughter
  I check every window, I lock every door
  I stood up in court with my hands all shaking
  I said it once, and I'll say it once more

  [chorus - layered female harmonies, strings, soft 808]
  Say my name, not his
  He's had his name in lights
  Say my name, I'm still here
  And I'm not afraid tonight

  [bridge - voice and piano only, very quiet]
  I am not a file, I am not a page
  I am not a black bar on a front-page rage
  I'm a woman with a name and a memory
  And the memory's mine, and I'm free

  [final chorus - huge, full strings, heavy drums, female voice soaring]
  Say my name, not his
  He's had his name in lights
  Say my name, I'm still here
  And I'm not afraid tonight

  [outro - voice alone, sung softly]
  Say my name
