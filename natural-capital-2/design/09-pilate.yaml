slug: bon-pilate
title: Pilate
order: 9
status: generate
credit: The Editor, the College, the Neighbour; the band on the bridge
version: 2   # Nov 15 13:20: Reuben 'pure clean instruments is a bad thing': raw, saturated, not overproduced
purpose: Everyone who could have stopped it washes their hands. Sung, soft and pretty, which makes it worse.
render: {bpm: 84, key: E minor, timesig: "4", seconds: 170}
caption: >-
  soulful folk trap, starts straight in with rich soulful group vocals over fingerpicked acoustic guitar, soft
  trap drums, warm 808 bass, verses sung by a weary male vocal and a bright female vocal, angry Scottish male rap
  on the bridge, fiddle sitting back in the mix, raw saturated live-sounding instruments, not overproduced, gritty warm blended mix, 84 bpm, E minor, ends on the group
  vocals singing
lyrics: |
  [chorus - starts immediately, rich soulful group vocals, acoustic guitar]
  I wash my hands, I wash my hands
  I didn't know and I don't understand
  A basin of water, a towel in my hand
  I wash my hands, I wash my hands

  [verse - weary male vocal, the editor]
  I had the story years before the rest
  The lawyers read it and they said it's best
  To wait for a second source, and a third, and a fourth
  Then his friends bought the adverts, so we waited some more

  [verse - bright female vocal, the college]
  He gave us millions for a building on the green
  We kept his name off it and we kept the money clean
  And when the reporters called to ask what we had known
  We said we'd review it, and we left it alone

  [chorus - rich soulful group vocals, trap drums]
  I wash my hands, I wash my hands
  I didn't know and I don't understand
  A basin of water, a towel in my hand
  I wash my hands, I wash my hands

  [verse - soft male vocal, the neighbour]
  I saw the cars come in at night
  Young faces in the back in the street light
  I closed the curtain, I'm a quiet man
  And I keep myself to myself, if I can

  [bridge - angry Scottish male rap, heavier drums]
  Pilate washed his hands too and they wrote it down for ever
  Two thousand years later and the stain's still there, whatever
  Ye can scrub till your skin's raw, ye can scrub till it's sore
  The basin remembers what the water was for

  [final chorus - everyone, layered harmonies]
  I wash my hands, I wash my hands
  I didn't know and I don't understand
  A basin of water, a towel in my hand
  I wash my hands. Amen.
