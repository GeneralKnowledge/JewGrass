slug: bon-redacted
title: Redacted
order: 12
status: generate
credit: Morag (sung lead), the band
version: 2   # Nov 15 13:20: Reuben 'pure clean instruments is a bad thing': raw, saturated, not overproduced
purpose: The files are finally released, and they're blacked out. The powerful are protected; a survivor's name slips through. The glitch is the redaction.
render: {bpm: 120, key: B minor, timesig: "4", seconds: 210}
caption: >-
  dark glitch pop with trap drums, starts straight in with a Scottish female lead vocal over pulsing synth bass,
  sharp glitch stutters cutting the vocal, hard-hitting live-sounding trap drums, deep 808, haunting layered sung chorus, banjo
  figure sitting back in the mix, heavy guitars on the final chorus, raw saturated live-sounding instruments, not overproduced, gritty warm blended mix, 120 bpm, B minor,
  ends on the sung chorus
lyrics: |
  [verse - starts immediately, Scottish female vocal, pulsing synth bass]
  They promised us the files and the files came out
  Thousands of pages and the black bars shout
  Flight to the island with a guest called redacted
  Dinner on the Tuesday with a man called redacted
  Money from a trust that's controlled by redacted
  Photo by the pool and the face is redacted

  [chorus - haunting layered sung vocals, glitch stutters]
  Redacted, redacted
  Every name that matters is subtracted
  Redacted, redacted
  They blacked out every powerful man
  And printed the girls who were attacked

  [verse - Scottish female vocal, trap drums]
  Protecting the inquiry, they said on the news
  Protecting the privacy of those who refuse
  Protecting the victims, they told us on air
  Then a victim's own name was printed right there
  Three hundred pages of a phone book in black
  And the one page that matters is the one they took back

  [chorus - haunting layered sung vocals, glitch stutters]
  Redacted, redacted
  Every name that matters is subtracted
  Redacted, redacted
  They blacked out every powerful man
  And printed the girls who were attacked

  [bridge - half time, female vocal, sparse]
  I can read a black bar, I can read it in the dark
  Every bar's the same length as the name behind the mark

  [final chorus - full band, heavy guitars, layered voices]
  Redacted, redacted
  Every name that matters is subtracted
  Redacted, redacted
  They blacked out every powerful man
  And printed the girls who were attacked
  Redacted. Amen.
