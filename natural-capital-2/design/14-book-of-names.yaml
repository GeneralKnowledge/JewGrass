slug: bon-book-of-names
title: Book of Names
order: 14
status: generate
credit: Morag, Rose, Frontman, and the whole glen as a choir
purpose: The answer to the black book. Morag comes home; the survivors write their own names in a different book. No one is jailed, but the names that matter are finally the right ones. Full pipes only in the last chorus.
render: {bpm: 80, key: D major, timesig: "4", seconds: 210}
caption: >-
  triumphant Celtic folk hymn with trap drums, live band, real recorded acoustic instruments, starts straight in
  with a tender Scottish female vocal over strummed acoustic guitar, a second fragile female vocal on the next
  verse, warm Scottish male vocal on the third verse, big warm community choir on the chorus, soft 808 and slow
  trap drums, fiddle sitting back, full Highland bagpipes join only on the final chorus, warm cohesive blended
  mix, 80 bpm, D major, ends with everyone singing
lyrics: |
  [verse - starts immediately, tender Scottish female vocal, acoustic guitar]
  I came home on the last bus up the glen
  With a box full of paper I'll never read again
  My brother met me at the bottom of the hill
  Said did ye get them? I said, I'm getting them still

  [verse - fragile female vocal, soft trap drums enter]
  I wrote down my name on a clean white page
  Not a file, not a number, not a black-barred cage
  And a hundred more wrote theirs below
  Every name a person that the world should know

  [chorus - big warm community choir, fiddle, 808]
  Write it in the book of names
  Not the ones who bought the shame
  Write the ones who stood and told
  Write them bright and write them bold
  Write it in the book of names

  [verse - warm Scottish male vocal]
  The guests are still out there smiling in the press
  A few of them are sorry and the rest of them care less
  And justice is slow and it's mostly asleep
  But the book's in our hands now, and the book's ours to keep

  [chorus - big warm community choir, fiddle, 808]
  Write it in the book of names
  Not the ones who bought the shame
  Write the ones who stood and told
  Write them bright and write them bold
  Write it in the book of names

  [final chorus - full Highland bagpipes join, everyone singing, heavy guitars]
  Write it in the book of names
  Not the ones who bought the shame
  Write the ones who stood and told
  Write them bright and write them bold
  Write it in the book of names

  [outro - everyone, sung slowly]
  Write it in the book of names. Amen.
