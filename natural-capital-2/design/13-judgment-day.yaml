purpose: The thesis. There isn't one monster. Everyone who flew, banked, buried, printed, guarded or looked away is in the book, and so are we, who turned it into memes and a football match between sides.
render: {bpm: 132, key: B minor, timesig: "4", seconds: 260}
caption: >-
  dark epic cinematic trap, starts straight in with an angry precise Scottish male rap over heavy trap drums and
  distorted 808, soaring female vocal and full choir on the chorus, heavy nu metal guitars on the chorus, a slow
  choir breakdown with the beat dropped out, screamed gang chant, glitch stutters, raw saturated live-sounding instruments, not overproduced, gritty warm blended mix,
  132 bpm, B minor, ends on the choir and gang singing together
lyrics: |
  [verse - starts immediately, angry precise Scottish male rap, heavy trap drums]
  Ye want one monster, it's easier that way
  One dead man in a cell and the rest walk away
  But a monster needs a jet and a jet needs a pilot
  A bank tae move the money and a lawyer tae keep it quiet
  A lord tae make him decent and a paper tae agree
  A college for the photo and a preacher for the tea
  A cop tae close the file and a guard tae fall asleep
  And a neighbour wi' the curtains shut and secrets tae keep

  [chorus - soaring female vocal and full choir, nu metal guitars]
  On judgment day, on judgment day
  Every name in the book will be read and weighed
  And it won't just be him and it won't be a few
  It'll be everyone who knew
  It'll be everyone who knew

  [verse - angry Scottish male rap, faster]
  And us? Aye, us. We're in the book as well
  We clicked on the island like a holiday to sell
  Made a meme of his death and a game of the list
  Turned the girls into content and a plot-twist
  Fought it out left and right like a football crowd
  Used it for our side, then we shouted it loud
  Then we scrolled on by to the next thing, bored
  Every one of us, Lord. Every one of us, Lord.

  [chorus - soaring female vocal and full choir, nu metal guitars]
  On judgment day, on judgment day
  Every name in the book will be read and weighed
  And it won't just be him and it won't be a few
  It'll be everyone who knew
  It'll be everyone who knew

  [bridge - beat drops out, slow choir only]
  Dies irae, dies illa
  Day of wrath and day of mourning
  Every secret in the ledger
  Comes to light without a warning

  [breakdown - screamed gang chant, drums return]
  Who flew the plane? (We knew!)
  Who moved the money? (We knew!)
  Who closed the file? (We knew!)
  Who looked away? (We knew!)

  [final chorus - everyone, choir, gang vocals, full band]
  On judgment day, on judgment day
  Every name in the book will be read and weighed
  And it won't just be him and it won't be a few
  It'll be everyone who knew
  Everyone who knew
