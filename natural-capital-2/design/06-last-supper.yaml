slug: bon-last-supper
title: Last Supper on Sabbath Cay
order: 6
status: generate
credit: Silas Varne, the host (fictional financier); his guests; Rose in the bridge
version: 2   # Nov 15 13:20: Reuben 'pure clean instruments is a bad thing': raw, saturated, not overproduced
purpose: The dinner on the island, told as the Last Supper. The host knows one of his friends will sell him out, and he's filmed them all as insurance.
render: {bpm: 66, key: F# minor, timesig: "4", seconds: 240}
caption: >-
  dark slow R&B trap, starts straight in with a silky deep male half-sung vocal over warm Rhodes piano and deep
  sub bass, slow heavy trap drums, eerie layered male and female backing vocals on the chorus, a distant church
  choir pad sitting back, one soft fragile female vocal in the bridge, raw saturated live-sounding instruments, not overproduced, gritty warm blended mix, 66 bpm,
  F# minor, ends on the eerie sung chorus
lyrics: |
  [verse - starts immediately, silky deep male half-sung vocal, Rhodes and sub bass]
  Welcome to the island, take a seat at the table
  Twelve of my friends and every one of them able
  A lord on my left and a senator right
  And a preacher at the end to say grace tonight
  The wine's from a cellar that a bishop once blessed
  The cameras are everywhere, darling, they're for my guests

  [chorus - eerie layered backing vocals, slow trap drums]
  Take this, all of you, and eat
  Every one of you is filmed in every seat
  Take this, all of you, and drink
  I'm not as alone as you think

  [verse - silky deep male half-sung vocal]
  One of you will sell me, that's the way of the meal
  Thirty bits of silver or a prosecutor's deal
  But I keep a little ledger, and I keep it in a safe
  And if they take me down, then the ledger takes my place
  That's my insurance, darling, that's my grace
  Every friend I ever had has a page with their face

  [chorus - eerie layered backing vocals, slow trap drums]
  Take this, all of you, and eat
  Every one of you is filmed in every seat
  Take this, all of you, and drink
  I'm not as alone as you think

  [bridge - beat drops out, soft fragile female vocal, far away]
  There were girls pouring drinks who were too young to pour
  And nobody at the table ever asked what for

  [verse - deep male vocal, slower, colder]
  So eat up and drink up and smile for the lens
  You're not my disciples, you're worse, you're my friends

  [final chorus - full, eerie voices layered high]
  Take this, all of you, and eat
  Every one of you is filmed in every seat
  Take this, all of you, and drink
  I'm not as alone as you think

  [outro - eerie backing vocals, sung softly]
  Grace is said. Amen.
