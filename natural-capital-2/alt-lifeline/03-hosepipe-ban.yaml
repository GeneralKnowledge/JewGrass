caption: >-
  fast Celtic folk punk shout-along, live band, real recorded instruments, starts straight in with a shouted
  Scottish female lead vocal, driving punk drums, fast strummed acoustic and distorted electric guitars, banjo
  rolls blended underneath, gang vocal chorus, distorted 808 hits on the chorus, glitch stutters on the breaks,
  half-time sung bridge, warm cohesive blended mix, 170 bpm, E minor, ends on a shouted sung chorus
lyrics: |
  [verse - starts immediately, shouted Scottish female vocal, fast punk drums]
  Thirty-one degrees on the underground line
  Letter on the mat says the water's in decline
  No sprinklers, no paddling pools, no hose
  Fined if your tomatoes get a drink, I suppose
  But down by the river where the fancy boats moor
  Albion's opened up the overflow once more

  [chorus - gang vocals, everyone shouting]
  Hosepipe ban! In a country made of rain!
  Hosepipe ban! And the river's down the drain!
  I can't water my window box or fill a paddling pool
  But they fill up the river and they call it the rules
  Hosepipe ban!

  [verse - shouted female vocal, banjo rolls]
  Editor says, Morag, you're on water now
  Glen girl in the city with a notebook and a vow
  There's a leak on every corner, a third of it gone
  And a dividend sent off before the leak's even done
  Phoned the press office, no comment at this time
  Took a sample from the river and it's ten times the line

  [chorus - gang vocals, everyone shouting]
  Hosepipe ban! In a country made of rain!
  Hosepipe ban! And the river's down the drain!
  I can't water my window box or fill a paddling pool
  But they fill up the river and they call it the rules
  Hosepipe ban!

  [bridge - half time, sung female vocal]
  Back home it rains three hundred days a year
  Here it rains for profit and the profit isn't here

  [final chorus - everyone, louder, distorted guitars]
  Hosepipe ban! In a country made of rain!
  Hosepipe ban! And the river's down the drain!
  I can't water my window box or fill a paddling pool
  But they fill up the river and they call it the rules
  Hosepipe ban! Hosepipe ban!
