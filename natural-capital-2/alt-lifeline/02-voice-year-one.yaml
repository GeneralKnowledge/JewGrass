purpose: Start the clock. The hill is theirs; the lifelines aren't.
render: {seconds: 40}
script: |
  Morag, it's me. Year one.
  The hill's still ours, in case you were wondering.
  Shop's busy. Walkers everywhere.
  Burn's running brown again after the rain, but that's no news.
  Ferry's broke. Again. Ninety miles round for a pint of milk.
  Anyway. Good luck in London.
  Don't let them make you posh.
  Phone me back.
