# Baseline run (Nov 15): every act's captions rewritten in the style of the overnight Natural Capital run
# (Nov 14 night, takes in project files album-run1/ and album-xl/) and Swim at Your Own Risk.
#
# Overnight style: one line, genre fusion first, then the voice (accent + attitude), then a handful of
# concrete instruments with character (distorted 808, hard drums, heavy guitars on the chorus), one or two
# song-specific colours, "raw mix", tempo. No mix-engineering boilerplate, no word piles about clean/not clean.
#
# Rules kept (they fix real problems): no crackle/hiss/static/vinyl/gramophone/typewriter/tape words
# (they add static), no circus/oom-pah instruments, songs start straight in and end sung (spoken outros
# dropped). Key and time signature still go to the model through key/timesig, not the caption.
#
# Each act: source = snapshot in sources/, slug prefix for this run. Lyrics, length, bpm, key come from the
# source unchanged, except where noted (drop_outro).

acts:
  natural-capital:
    note: Recreates the overnight album. Captions are the overnight text with only the static-prone words removed.
    source: sources/natural-capital.yaml
    prefix: nc-
    drop_outro: true            # the spoken "due Friday" outros (rule: end sung). Spoken intros stay.
    no_key: true                # the overnight run had no key conditioning
    skip: [brass-plate]         # Reuben dropped it (Nov 14)
    extra:
      - slug: swim-at-your-own-risk
        title: Swim at Your Own Risk
        seconds: 240
        bpm: 140
        lyrics_file: sources/swim-at-your-own-risk.lyrics.txt
        note: Reuben's favourite, made on the laptop. Rendered again with its own caption as the control take.
    captions:
      bought-and-sold: dark political hip hop with Celtic country trap, hard boom bap drums switching to heavy trap, distorted 808 bass, angry precise male rap, Scottish accent, solo bagpipe lament in the intro, banjo and fiddle loops, nu metal guitars on the chorus, haunting female vocal bridge, gang chant chorus, raw mix, 82 bpm
      natural-capital: dark glitch trap, slow build, minimal then huge, whispered close-mic English female spoken word, cool half-sung female vocal, sneering Scottish male rap features, chopped bagpipe drone used as a jingle, cheesy hold music sample, distorted 808 bass, crisp trap drums, champagne glass clinks, crowd applause, gang chant chorus, cinematic, raw mix
      fast-lane: loud flashy UK trap banger, cocky English male rap, posh chancer voice, laughing ad-libs, revving sports car 808 slides, hard trap drums, rapid hi-hats, cash register samples, distorted banjo riff, Celtic fiddle stabs, nu metal guitars on the chorus, gang chant hook, glitch stutters, raw mix, 145 bpm
      exit-strategy: dark epic cinematic trap, slow menacing build, whispered close-mic English female spoken word, panicked overlapping male voices on a conference call, sneering Scottish male rap, cool half-sung female vocal, heavy nu metal guitars and screamed gang chant chorus, distorted 808, glitch stutters, slowed broken hold music sample, church organ, solo bagpipe drone in the final chorus, huge raw mix, 130 bpm
      sunshine-trust: silky smooth yacht lounge trap, sultry calm English female vocal, half sung half spoken, never raises her voice, soft Rhodes electric piano, warm nylon string guitar, gentle steel pan accents, seagulls and lapping waves, champagne clinks, deep clean 808, slow crisp trap drums, lazy hi-hats, faint glitch on the money lines, elegant and empty, 96 bpm
      # was "typewriter and printing press as drums"
      ermine-and-ink: baroque harpsichord trap, pompous posh English male rap, aristocratic sneer, duet with a gravelly older male newsreader voice, heavy stamp thuds as percussion, string quartet stabs, brass fanfare, distorted 808, hard trap drums, rolling hi-hats, glitch cut-up headlines, regal chant chorus, satirical, raw mix, 92 bpm
      # was "subtle tape hiss, gentle glitch fade at the end"
