# NIGHTSHIFT FM Song Design: Ghost Ride (track 05).
slug: nightshift-ghost-ride
title: Ghost Ride
order: 5
family: ambient
version: 1
role: The most atmospheric and melodic track on the album.
test: Can JewGrass make a track that works as atmospheric listening as well as phonk?

render:
  bpm: 100
  key: D minor
  timesig: "4"
  seconds: 230        # 88 bars at 100 is 211 s

palette:
  lead: signal-bell moved to D minor (two notes, F down to D), played on warm detuned synth bells
  bed: distant choir-like pads, wide in groove A2
  bass: rolling 808, more prominent in groove C
  drums: soft Memphis drums, low in the mix
  extra: a soft guitar phrase blended into the pads in groove C
  left_out: distortion, cowbell lead, hard snare

harmony: Dm - Bb - F - C, spacious open voicings; the melody carries the melancholy.
drums: Soft kick on 1 and the "and" of 2, rimshot on 3, slow swung hats; groove A2 adds a second hat layer.
bass_movement: 808 holds roots and rolls in triplets into each new four-bar phrase.
vocal_motif:
  voice: soft
  phrase: "Ride with me"
  treatments: [quiet spoken, pitched melodic chop following the bell notes, pitched higher in motif B2]
the_moment: The break. The drums disappear and the bells and pads hang in the air before groove C lands.

sections:
  - name: intro
    tag: intro - instrumental, two-note bell motif, wide pads, no drums
    bars: 8
    performer: none
  - name: groove A
    tag: groove - instrumental, soft Memphis drums, rolling 808, warm detuned bells
    bars: 16
    performer: none
  - name: motif B
    tag: hook - quiet female spoken phrase becomes a pitched melodic vocal chop
    bars: 8
    performer: soft
    lyrics: |
      Ride with me
      Ride, ride with me
  - name: groove A2
    tag: groove - instrumental, wider choir pads, extra hi-hats
    bars: 16
    performer: none
  - name: break
    tag: break - instrumental, drums disappear, bells and pads only
    bars: 8
    performer: none
  - name: groove C
    tag: groove - instrumental, bass more prominent, soft guitar phrase blended into the pads
    bars: 16
    performer: none
  - name: motif B2
    tag: hook - the vocal chop pitched higher, bells answer it
    bars: 8
    performer: soft
    lyrics: |
      Ride, ride
      Ride with me
  - name: outro
    tag: outro - instrumental, drums fall away, bell motif fades into the pads
    bars: 8
    performer: none

ending: The two-note bell over a held pad, fading, the second note left hanging.
transmission_layer: none during the music. A clean, clear transmission is this track's contrast; one short filtered tail at the very end.
caption: >-
  100 bpm, D minor, the most melodic and atmospheric track, warm detuned synth bells playing a haunting two-note
  motif, distant choir-like pads, rolling 808, soft Memphis drums, a quiet female spoken
  phrase turned into a pitched melodic vocal chop, beautiful but slightly unsettling, nothing distorted
