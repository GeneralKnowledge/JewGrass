    dark epic industrial trap, slow menacing build, powerful and oppressive, an emergency conference call, church organ playing a slow uneasy chord progression throughout, heavy half-time drums with metallic industrial percussion, distorted 808 and pounding industrial bass, panicked overlapping English male voices, a sneering Scottish male rapper, a cool calm English female voice half sung and whispered, heavy distorted guitars and a screamed gang chant chorus, a slowed warped hold music melody in the intro, a low bagpipe drone under the final chorus, ends on a held organ chord and a phone call disconnect beep, huge clean mix, 130 bpm
  lyrics: |
    [intro - slowed broken hold music, conference call beep]
    You are now joining the call.
    Is everyone on? Lovely.
    Has anyone seen the paper this morning?

    [verse - panicked overlapping male voices, church organ, heavy half-time drums]
    Front page, my face, the glen and the trees
    The fund, the partners, the brass plate fees
    The oil man's shouting, the water man's sweating
    The mask man's laughing, the lord's forgetting
    I never met her. I don't recall.
    My office handles it. Not me at all.

    [chorus - screamed gang chant, heavy distorted guitars]
    Bought and sold! Bought and sold!
    Sell it on before it's cold
    Bought and sold! Bought and sold!
    Every scandal's worth its weight in gold

    [verse - sneering Scottish male rap, organ and industrial drums]
    The reporter's a lassie from a glen up north
    Her brother's on the phone and the papers come forth
    Leaked by a lad that we paid to keep the gate
    Gav? Gav, ye idiot, ye've sealed our fate
    And the Grid Man, flat as a dial tone, says
    Switch it off. Send the bill. Begin again.

    [chorus - screamed gang chant, heavy distorted guitars]
    Bought and sold! Bought and sold!
    Sell it on before it's cold
    Bought and sold! Bought and sold!
    Every scandal's worth its weight in gold

    [verse - cool calm English female voice, half sung, drums thin out, money theme looping]
    Calm down, darlings. Breathe. Sit tight.
    Did you think there'd be handcuffs? Did you think that was right?
    Nobody's charged and nobody's named
    Committee will meet and the system gets blamed
    I sold it on Thursday at forty percent
    To a pension abroad that won't ask where it went
    The trees are still dead and the houses still dear
    And all of us here will be richer next year

    [bridge - everything drops to organ, whispered close-mic female voice]
    Thank you all for joining.
    The glen is no longer our concern.
    The village wants to buy it? How sweet.
    Let them. At market value.
    Settlement's due Friday.

    [final chorus - biggest, gang chant, guitars, a low bagpipe drone underneath]
    Bought and sold! Bought and sold!
    Sell it on before it's cold
    Bought and sold! Bought and sold!
    Every scandal's worth its weight in gold
    Bought and sold!
    Bought and sold!

    [outro - band cuts, organ holds one chord, call disconnect beep]
