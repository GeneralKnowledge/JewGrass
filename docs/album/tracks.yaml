  caption: |
    dark glitch trap, slow build, minimal then huge, whispered close-mic English female spoken word, cool half-sung female vocal, sneering Scottish male rap features, chopped bagpipe drone used as a jingle, cheesy hold music sample, distorted 808 bass, crisp trap drums, champagne glass clinks, crowd applause, gang chant chorus, cinematic, raw mix
  lyrics: |
    [intro]
    Thank you all for coming.
    Do help yourselves to the salmon.
    It's local. Everything here is local,
    except the money.
    Ladies and gentlemen... your future.

    [verse]
    I don't see a glen, I see a balance sheet
    Bog and bracken, darling, that's a carbon receipt
    Every inch of heather is a unit I can sell
    Every drop of rain, I'll invoice that as well
    Bought it off a laird who was tired of the cold
    Paid him in pounds, and I'll sell it back in gold
    Plant a little forest where no forest should grow
    It doesn't have to live, it just has to look good on a slide show

    [chorus]
    Natural capital! (Ka-ching!)
    Every hill is a bank and the deer can sing
    Natural capital! (Sold!)
    Greenest thing in Scotland and it's paved with gold
    Natural capital!

    [verse]
    Doc Rory Mair, I'm the man with the stamp
    Call a bog a forest and a puddle a swamp
    Fee's in advance and the science is flexible
    Planet's a client and the client's always delectable

    I am the Grid Man. Wind blows, I win.
    Wind stops, I win. Cable's full, I win.
    Switch it off. Send the bill. Begin.

    Hi guys, it's Tamsin! I'm literally obsessed
    Beavers and a sauna and a forty-quid rest
    Book the glamping pods while the locals are asleep
    Wellness in the wilderness, the wilderness is cheap

    And I'm just a humble peer with a word for the minister
    Planning's a formality, the pylons aren't sinister
    Paperwork's sorted and the hearing's adjourned
    And the village? The village will be very concerned

    [chorus]
    Natural capital! (Ka-ching!)
    Every hill is a bank and the deer can sing
    Natural capital! (Sold!)
    Greenest thing in Scotland and it's paved with gold
    Natural capital!

    [bridge]
    They'll call it a land grab.
    We call it a nature-based solution.
    They'll call it a clearance.
    We call it a transition.
    Same glen. Same leaving.
    Better branding.

    [verse]
    Tax relief in the morning, a grant by lunch
    Credits by teatime, and that's just the brunch
    Village wants houses? Well, so do the bees
    Can't put a family where I put the trees
    Ninety-nine years and a covenant tight
    Hill's off limits to the walkers at night
    And in five or six years when the numbers are done
    I'll sell it again to the next one along

    [chorus]
    Natural capital! (Ka-ching!)
    Every hill is a bank and the deer can sing
    Natural capital! (Sold!)
    Greenest thing in Scotland and it's paved with gold
    Natural capital! Natural capital!

    [outro]
    Thank you so much. Do enjoy the views.
    They're ours now.
    Settlement's due Friday.
