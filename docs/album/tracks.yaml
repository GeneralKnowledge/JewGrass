  caption: |
    dark political hip hop with Celtic country trap, hard boom bap drums switching to heavy trap, distorted 808 bass, angry precise male rap, Scottish accent, solo bagpipe lament in the intro, banjo and fiddle loops, nu metal guitars on the chorus, haunting female vocal bridge, gang chant chorus, raw mix, 82 bpm
  lyrics: |
    [intro]
    They tell ye it's new. It's no new.
    Sit doon. This is the long version.

    [verse]
    Sixteen ninety-eight, a nation bet the lot
    On a swamp in Panama, a colony that rot
    Fever in the tents and the ships came hame light
    A fortune in the mud and a country in a fright
    So the men wi' the money took a cheque to sign away
    Called it the Equivalent, a lovely word for pay
    Parliament adjourned and the pens went to work
    The crowds in the street, and the lords did the smirk
    They paid back the shareholders, the bonnet lairds were sorted
    The ploughman got nothing but the news when it reported
    Three hundred years later, same suit, different cloth
    A glen for a carbon cheque, a land for a loss

    [chorus]
    Bought and sold! (Bought and sold!)
    For somebody else's gold!
    Same glen, same leaving, better branding on the deed
    Bought and sold! (Bought and sold!)
    And the story's never told
    They don't burn the roofs now, they just send ye the receipt

    [verse]
    Next came the sheep, the factor wi' the torch
    Families on the shore wi' a Bible and a porch
    No porch, just the beach, and the boats to the west
    Forty thousand acres for a hundred-sheep rest
    Now the glens are empty and they call it a view
    Wild land, wilderness, it was full of people too
    And the same estates now are a portfolio line
    Rewilding a hill that was cleared the first time
    Plant a sitka forest on the bones of a croft
    Sell the air above it to a firm in a loft
    Ye can't buy a hoose in the glen where ye were born
    But a fund in the Capital can buy it every morn

    [chorus]
    Bought and sold! (Bought and sold!)
    For somebody else's gold!
    Same glen, same leaving, better branding on the deed
    Bought and sold! (Bought and sold!)
    And the story's never told
    They don't burn the roofs now, they just send ye the receipt

    [verse]
    Seventy-four, a report on the oil
    Said Scotland's rich, so they buried it in foil
    Thirty years secret, while the platforms pumped
    And the pits shut down and the shipyards slumped
    Now a letterbox in Glasgow holds four hundred names
    A brass plate company for anybody's games
    Billions through partnerships nobody would own
    Till the regulators noticed it and changed the tone
    Ten point nine billion gone in the panic years
    Fast lane contracts, slow lane tears
    And the profit takes a yacht to a sunny British rock
    Where the trust owns the trust and the clock's got no clock

    [bridge]
    Fareweel to a' our Scottish fame
    Fareweel our ancient glory
    We were bought and sold, we were bought and sold
    And they're telling us the same old story

    [breakdown]
    Who owns the hill? (Not you!)
    Who owns the water? (Not you!)
    Who owns the oil? (Not you!)
    Who owns the law? (Not you!)
    Who owns the hill?
    (We will.)

    [outro]
    They didnae need a war this time.
    Just a form, a fund, and an address in Glasgow.
    Next track.
